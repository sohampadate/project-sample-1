<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09090b">
  <title>Sports Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,600;1,700;1,800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body style="background:#09090b;color:#f4f4f5;">

  <!-- Shown only if script.js does not load. script.js removes it as soon as the app starts. -->
  <div id="load-error" style="padding:1.5rem;font-family:Arial,sans-serif;line-height:1.5;">
    <strong>Loading Sports Management...</strong><br>
    If this message stays, the app file could not load. Keep
    <b>index.html</b>, <b>styles.css</b> and <b>script.js</b> together in the same folder,
    with exactly these names, and open <b>index.html</b>.
  </div>
  <noscript>Sports Management needs JavaScript. Please turn it on in your browser.</noscript>

  <!-- Login / sign up screen (filled in by script.js) -->
  <div class="auth" id="auth" hidden></div>

  <!-- Main app after login (filled in by script.js) -->
  <div class="app" id="app" hidden></div>

  <!-- Confirm dialog -->
  <div class="modal" id="confirm-modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="confirm-text">
      <p id="confirm-text"></p>
      <div class="modal-actions">
        <button type="button" class="btn" id="confirm-no">Cancel</button>
        <button type="button" class="btn primary" id="confirm-yes">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
